[workspace]
resolver = "2"
members = [
    "crates/periscrawl-core",
    "crates/periscrawl-cli",
    "crates/periscrawl-gui",
    "crates/periscrawl-tui",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Periscrawl contributors"]
license = "MIT"

[workspace.dependencies]
# Shared across crates. Versions match the pre-split manifest.
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = "0.36.2"
fuzzy-matcher = "0.3.7"
headless_chrome = { version = "1.0", features = ["fetch"] }
notify = "6.1.1"
publicsuffix = "2.2"
rand = "0.9.2"
ratatui = "0.29"
regex = "1.10"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rfd = "0.17.2"
rusqlite = { version = "0.38", features = ["bundled"] }
rust_xlsxwriter = { version = "0.96.0", default-features = false, features = ["constant_memory"] }
scraper = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tui-piechart = "0.2.8"
url = "2.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
